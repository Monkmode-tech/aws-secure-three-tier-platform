name: terraform-plan

# Runs `terraform plan` against the real account on pull requests and posts the
# result as a PR comment. Authentication is GitHub OIDC -> the read-only role
# created by bootstrap/ - there are no AWS keys stored in this repository.
#
# The job is skipped until these repository variables exist
# (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_PLAN_ROLE_ARN  output plan_role_arn from bootstrap/
#   TF_STATE_BUCKET    output state_bucket from bootstrap/
#   AWS_REGION         e.g. us-east-2
#   TF_DOMAIN_NAME     optional, same as domain_name in terraform.tfvars
#   TF_ALERT_EMAIL     optional
#
# Applies are deliberately manual (from a workstation) - see docs/runbook.md.

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.TF_DOMAIN_NAME }}
      TF_VAR_alert_email: ${{ vars.TF_ALERT_EMAIL }}
    defaults:
      run:
        shell: bash
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=aws-secure-three-tier-platform/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes present; anything else is a failure.
          [[ $code -eq 0 || $code -eq 2 ]]

      - name: Comment plan on the PR
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('environments/dev/plan.txt', 'utf8');
            const max = 60000;
            const body = raw.length > max ? raw.slice(raw.length - max) : raw;
            const summary = (raw.match(/Plan: .*|No changes\..*/) || ['(see log)'])[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### terraform plan — environments/dev\n**${summary}**\n<details><summary>Show plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            });
